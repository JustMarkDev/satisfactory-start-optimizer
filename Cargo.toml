[package]
name = "satisfactory-start-optimizer"
version = "1.0.0"
edition = "2024"

[lib]
name = "satisfactory_start_optimizer"
path = "src/lib.rs"

[[bench]]
name = "optimizer"
harness = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.9"
actix-web = "4.13.0"
actix-cors = "0.7.1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
