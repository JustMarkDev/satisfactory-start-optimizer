name: Release

# Tags and publishes a GitHub release from conventional commits on main. Called by ci.yml
# after the CI gate passes.
on:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      # Bumps package.json, Cargo.toml and Cargo.lock, commits, tags, and publishes the release.
      # --force: package.json pins bun through devEngines, so npm/npx aborts
      # with EBADDEVENGINES without it (only way to skip the check per npm/rfcs#830).
      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --force -y -p semantic-release@25.0.9 -p @semantic-release/exec@7.1.0 -p @semantic-release/git@11.0.1 semantic-release
