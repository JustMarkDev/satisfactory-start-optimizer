name: Release

# Tags and publishes a GitHub release from conventional commits on main. Called by ci.yml
# after the CI gate passes.
on:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@main
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@main
        with:
          node-version: lts/*

      # Bumps package.json, Cargo.toml and Cargo.lock, commits, tags, and publishes the release.
      # --force: package.json pins bun through devEngines, so npm/npx aborts
      # with EBADDEVENGINES without it (only way to skip the check per npm/rfcs#830).
      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --force -y -p semantic-release@latest -p @semantic-release/exec@latest -p @semantic-release/git@latest semantic-release
